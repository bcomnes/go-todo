name: release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease
          - custom
      new-version:
        description: Explicit semantic version for custom, such as 0.1.0 (no leading v)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: go-todo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/go_todo?sslmode=disable
      SESSION_COOKIE_SECURE: false

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: go_todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: make deps

      - name: Apply migrations
        run: make migrate-up

      - name: Verify rollback
        run: |
          make migrate-down
          make migrate-down

      - name: Reapply migrations
        run: make migrate-up

      - name: Validate
        run: make build test

      - id: release
        uses: bcomnes/go-bump@v0
        with:
          version-type: ${{ inputs.version-type }}
          new-version: ${{ inputs.new-version }}
          github-token: ${{ github.token }}
          pre-publish: make build test

      - name: Release summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        run: echo "Published $RELEASE_TAG"
